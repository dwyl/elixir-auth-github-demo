name: Elixir CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['28.0.1']
        elixir: ['1.18.4']
    steps:
    - uses: actions/checkout@v7 # github.com/actions/checkout
    - name: Set up Elixir
      uses: erlef/setup-beam@v1 # github.com/erlef/setup-beam
      with:
        otp-version: ${{ matrix.otp }}
        elixir-version: ${{ matrix.elixir }} 
    - name: Restore deps and _build cache
      uses: actions/cache@v6   # github.com/actions/cache
      with:
        path: |
          deps
          _build
        key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}
    - name: Install dependencies
      run: mix deps.get
    - name: Check code is formatted
      run: mix format --check-formatted
    - name: Run Tests
      run: mix coveralls.json
      env:
        MIX_ENV: test
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7 # github.com/codecov/codecov-action
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # Continuous Deployment to Fly.io
  # fly.io/docs/app-guides/continuous-deployment-with-github-actions/
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: build
    # stackoverflow.com/questions/58139406/only-run-job-on-specific-branch-with-github-actions
    if: github.ref == 'refs/heads/main'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7 # github.com/actions/checkout
      - uses: superfly/flyctl-actions@1.5 # github.com/superfly/flyctl-actions
        with:
          args: "deploy"
